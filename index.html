<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Hero Optimizer Engine</title>

<script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>

<body class="bg-gray-100 p-6">

<div class="max-w-6xl mx-auto">

<h1 class="text-3xl font-bold mb-6">⚡ Hero Optimization Engine</h1>

<!-- INPUTS -->
<div class="bg-white p-4 rounded-2xl shadow grid md:grid-cols-5 gap-4 mb-6">

<div>
<label>Gold (M)</label>
<input id="gold" type="number" step="0.1" value="0.5" class="w-full border p-2 rounded">
</div>

<div>
<label>Sparks (K)</label>
<input id="sparks" type="number" step="0.1" value="5" class="w-full border p-2 rounded">
</div>

<div>
<label>Heroes</label>
<input id="heroes" type="number" value="10" class="w-full border p-2 rounded">
</div>

<div class="flex items-end">
<button onclick="runEngine()" class="bg-black text-white px-4 py-2 rounded-xl w-full">
Run Simulation
</button>
</div>

</div>

<!-- STATUS -->
<div class="bg-white p-4 rounded-2xl shadow mb-6 flex justify-between">
<div>
<h3 class="font-semibold">Status</h3>
<p id="status">Idle</p>
</div>
<div id="dot" class="w-4 h-4 rounded-full bg-gray-400"></div>
</div>

<!-- OUTPUT -->
<div class="grid md:grid-cols-3 gap-4 mb-6">

<div class="bg-white p-4 rounded-2xl shadow">
<h3>Total Power</h3>
<p id="power" class="text-2xl font-bold">0</p>
</div>

<div class="bg-white p-4 rounded-2xl shadow">
<h3>Gold Left</h3>
<p id="goldOut"></p>
</div>

<div class="bg-white p-4 rounded-2xl shadow">
<h3>Sparks Left</h3>
<p id="sparkOut"></p>
</div>

</div>

<!-- PROGRESS -->
<div class="bg-white p-4 rounded-2xl shadow mb-6">
<h3 class="mb-2">Progress</h3>
<progress id="progress" value="0" max="100" class="w-full"></progress>
</div>

<!-- RESULT -->
<div class="bg-white p-4 rounded-2xl shadow">
<h3>Hero Allocation</h3>
<div id="result"></div>
</div>

</div>

<script>
let worker;

function runEngine() {

setStatus("Starting engine...", "orange");

if (worker) worker.terminate();

worker = new Worker("engine.js");

let G = +gold.value * 1_000_000;
let S = +sparks.value * 1_000;
let H = +heroes.value;

worker.postMessage({G,S,H});

worker.onmessage = function(e) {

let data = e.data;

if (data.type === "progress") {
progress.value = data.p;
setStatus("Processing... " + data.p + "%", "orange");
}

if (data.type === "done") {

setStatus("Completed", "green");

power.innerText = data.result.power;

goldOut.innerText = (data.result.goldLeft / 1_000_000).toFixed(2) + " M";
sparkOut.innerText = (data.result.sparkLeft / 1_000).toFixed(2) + " K";

result.innerHTML = data.result.heroes
.map((h,i)=>`Hero ${i+1} → Level ${h}`)
.join("<br>");

}

};

}

function setStatus(text,color) {
status.innerText = text;
dot.style.background = color;
}
</script>

</body>
</html>
