<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Hero Upgrade Data</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      padding: 20px;
    }
    pre {
      background: #f4f4f4;
      padding: 15px;
      border-radius: 8px;
      overflow-x: auto;
    }
  </style>
</head>
<body>

<h2>Hero Upgrade Data (JSON)</h2>

<pre id="output"></pre>

<script>
const heroData = [
  { level: 1, gold: 7000, sparks: 250, power: 22 },
  { level: 2, gold: 7500, sparks: 260, power: 22 },
  { level: 3, gold: 8000, sparks: 270, power: 22 },

// Also log to console
console.log(dataWithEfficiency);
</script>

</body>
</html>
